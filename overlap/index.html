<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Red Checkered Past</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>My Red Checkered Past</h1>
    </header>
    <main>
      <!-- COntent -->
      <div class="grid">
        <section class="image-one">
          <img src="https://placehold.co/200x200" alt="Image 1" />
        </section>
        <section class="content-one">
          <p>
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ducimus
            modi aliquid, incidunt obcaecati ea, voluptatem architecto in minus
            dicta officia at alias unde quas magnam itaque officiis, ipsum quos
            praesentium! Eius accusantium eligendi ad cumque?
          </p>
        </section>
        <!-- Join Button -->
        <aside id="join-button">Join Now</aside>

        <!-- Black Pieces -->
        <div class="checker-black-1">
          <img src="images/black-checker-piece.png" alt="Checker 1" />
        </div>
        <div class="checker-black-2">
          <img src="images/black-checker-piece.png" alt="Checker 3" />
        </div>
        <div class="checker-black-3">
          <img src="images/black-checker-piece.png" alt="Checker 6" />
        </div>
        <div class="checker-black-4">
          <img src="images/black-checker-piece.png" alt="Checker 7" />
        </div>

        <!-- Red Pieces -->
        <div class="checker-red-1">
          <img src="images/red-checker-piece.png" alt="Checker 2" />
        </div>
        <div class="checker-red-2">
          <img src="images/red-checker-piece.png" alt="Checker 4" />
        </div>
        <div class="checker-red-3">
          <img src="images/red-checker-piece.png" alt="Checker 5" />
        </div>
      </div>
    </main>
  </body>
</html>
